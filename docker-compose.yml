services:
  # ── API Backend (FastAPI) ──────────────────────────────────────────────────
  api:
    build: .
    container_name: univasf-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-univasf}:${POSTGRES_PASSWORD:-univasf}@postgres:5432/${POSTGRES_DB:-univasf}
    volumes:
      # Gerados em runtime (uploads via admin, chunks do BM25, logs de query) — não
      # fazem parte da imagem além do que já estiver versionado no git. Sem esses
      # volumes, um `docker compose up -d --build` (rebuild) perderia documentos
      # enviados via /admin/documents e degradaria o BM25 para busca só-densa,
      # silenciosamente, para qualquer conteúdo processado desde o último commit.
      - data_raw:/app/data/raw
      - data_chunks:/app/data/chunks
      - data_logs:/app/data/logs
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # ── ChromaDB (Banco Vetorial) ──────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: univasf-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ── PostgreSQL (Banco Relacional — cursos, documentos, professores) ────────
  postgres:
    image: postgres:16-alpine
    container_name: univasf-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-univasf}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-univasf}
      - POSTGRES_DB=${POSTGRES_DB:-univasf}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-univasf}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ── Cloudflare Tunnel (Exposição Segura) ───────────────────────────────────
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: univasf-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - api
    networks:
      - app-network

volumes:
  chroma_data:
    driver: local
  postgres_data:
    driver: local
  data_raw:
    driver: local
  data_chunks:
    driver: local
  data_logs:
    driver: local

networks:
  app-network:
    driver: bridge
